<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="PewJay Official — Website Opening"
    >

    <title>PewJay Official | Opening</title>


    <!-- =====================================================
         FONTS
         ===================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    >


    <!-- =====================================================
         CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="css/opening.css"
    >

</head>


<body>


    <!-- =====================================================
         OPENING SCREEN
         ===================================================== -->

    <main class="opening-screen">


        <!-- Background -->

        <div class="opening-background"></div>


        <!-- Dark / Blue Overlay -->

        <div class="opening-overlay"></div>


        <!-- Ambient Light -->

        <div class="opening-light opening-light-one"></div>

        <div class="opening-light opening-light-two"></div>


        <!-- =================================================
             CONTENT
             ================================================= -->

        <section class="opening-content">


            <!-- Small Label -->

            <span class="opening-label">
                PEWJAY OFFICIAL
            </span>


            <!-- Logo -->

            <div class="opening-logo">

                <img
                    src="images/logo/name.png"
                    alt="PewJay Official"
                >

            </div>


            <!-- Main Text -->

            <h1>
                WELCOME
            </h1>


            <p class="opening-description">

                Digital Art • Sketching • Animation
                • Livestream • World Tour

            </p>


            <!-- =================================================
                 COUNTDOWN
                 ================================================= -->

            <div class="opening-countdown">


                <div class="countdown-item">

                    <strong id="opening-days">
                        00
                    </strong>

                    <span>
                        DAYS
                    </span>

                </div>


                <div class="countdown-separator">
                    :
                </div>


                <div class="countdown-item">

                    <strong id="opening-hours">
                        00
                    </strong>

                    <span>
                        HOURS
                    </span>

                </div>


                <div class="countdown-separator">
                    :
                </div>


                <div class="countdown-item">

                    <strong id="opening-minutes">
                        00
                    </strong>

                    <span>
                        MINUTES
                    </span>

                </div>


                <div class="countdown-separator">
                    :
                </div>


                <div class="countdown-item">

                    <strong id="opening-seconds">
                        00
                    </strong>

                    <span>
                        SECONDS
                    </span>

                </div>


            </div>


            <!-- Status -->

            <div
                class="opening-status"
                id="opening-status"
            >

                WEBSITE OPENING SOON

            </div>


            <!-- Loading Line -->

            <div class="opening-progress">

                <span
                    id="opening-progress-bar"
                ></span>

            </div>


        </section>


        <!-- =================================================
             CORNER INFORMATION
             ================================================= -->

        <div class="opening-corner opening-corner-left">

            <span>
                PEWJAY
            </span>

        </div>


        <div class="opening-corner opening-corner-right">

            <span>
                2026
            </span>

        </div>


    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="js/opening.js"></script>


</body>

</html>
