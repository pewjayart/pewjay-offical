<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="PewJay Official website maintenance page."
    >

    <title>
        THERE'S PROBLEM???
    </title>


    <!-- MAIN CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- MAINTENANCE CSS -->

    <link
        rel="stylesheet"
        href="css/maintenance.css"
    >

</head>


<body>


    <!-- =====================================================
         MAINTENANCE SCREEN
         ===================================================== -->

    <main
        class="maintenance-screen"
        id="maintenance-screen"
    >


        <!-- BACKGROUND -->

        <div
            class="maintenance-background"
            aria-hidden="true"
        ></div>


        <!-- BLUE OVERLAY -->

        <div
            class="maintenance-overlay"
            aria-hidden="true"
        ></div>


        <!-- LIGHT EFFECT -->

        <div
            class="maintenance-light"
            aria-hidden="true"
        ></div>


        <!-- CONTENT -->

        <section
            class="maintenance-content"
        >


            <!-- LOGO -->

            <div class="maintenance-logo">

                <img
                    src="images/logo/name.png"
                    alt="PewJay Official"
                >

            </div>


            <!-- LABEL -->

            <p class="maintenance-label">
                WEBSITE MAINTENANCE
            </p>


            <!-- HEADING -->

            <h1>
                WE'LL BE<br>
                RIGHT BACK
            </h1>


            <!-- DESCRIPTION -->

            <p class="maintenance-description">

                PewJay Official is currently undergoing
                scheduled website maintenance.

                <br>

                We're improving the experience,
                updating creative content, and
                preparing something new.

            </p>


            <!-- STATUS -->

            <div class="maintenance-status">

                <span
                    class="maintenance-dot"
                ></span>

                <span>
                    MAINTENANCE IN PROGRESS
                </span>

            </div>


            <!-- LINE -->

            <div
                class="maintenance-line"
                aria-hidden="true"
            ></div>


            <!-- FOOTER -->

            <p class="maintenance-footer">

                PEWJAY OFFICIAL
                <span>•</span>
                DIGITAL ART
                <span>•</span>
                ANIMATION
                <span>•</span>
                CREATIVITY

            </p>

        </section>


    </main>


    <!-- =====================================================
         MAINTENANCE JS
         ===================================================== -->

    <script
        src="js/maintenance.js"
    ></script>


</body>

</html>
